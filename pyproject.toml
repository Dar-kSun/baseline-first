[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "baseline-first"
version = "0.1.0"
description = "Run the dumb baseline before you train the big model: honest baselines, leakage-proof splits and effective sample size for single-cell perturbation data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aryan Sinha" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "anndata>=0.10",
    "typer>=0.12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
data = ["pertpy", "scanpy"]
# The official Virtual Cell Challenge 2026 scorer, pinned: scores are only comparable
# within one scorer version. Needs Python >= 3.11.
vcc = ["cell-eval2==0.18.0", "pdex==0.3.0"]  # pdex: the CPU DE engine cell-eval2 pins

[project.scripts]
baseline-first = "baseline_first.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["baseline_first"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call defaults; they are evaluated once and immutable.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
